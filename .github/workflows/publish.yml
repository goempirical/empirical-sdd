name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to retry
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.repository == 'goempirical/empirical-sdd' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install trusted-publishing npm client
        run: npm install --global npm@11.19.0

      - name: Verify immutable release inputs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"

          test "$package_name" = "empirical-sdd"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main

          if npm view "$package_name@$version" version --json >/dev/null 2>&1; then
            echo "$package_name@$version already exists on npm; refusing to replace an immutable release."
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run ci
      - run: npm publish --access public --tag latest
